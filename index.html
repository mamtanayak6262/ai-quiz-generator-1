
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi AI Quiz Generator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#08152e,#123b67);
 color:white;min-height:100vh;padding:20px
}
.container{max-width:850px;margin:auto}
header{text-align:center;padding:25px 10px}
header h1{font-size:34px;color:#55d9ff;margin:8px}
header p{color:#d1e8ff}
.card{
 background:#ffffff12;border:1px solid #ffffff25;
 border-radius:18px;padding:22px;margin:18px 0;
 box-shadow:0 10px 30px #0003
}
label{display:block;margin:14px 0 7px}
input,select{
 width:100%;padding:13px;border:0;border-radius:9px;
 background:#f1f6ff;color:#14213d;font-size:15px
}
button{
 border:0;border-radius:10px;padding:13px 18px;
 background:linear-gradient(90deg,#00b8e6,#2877ff);
 color:white;font-weight:bold;font-size:15px;
 cursor:pointer;margin-top:15px
}
button:disabled{opacity:.5;cursor:not-allowed}
.full{width:100%}
.option{
 display:block;width:100%;text-align:left;
 background:#ffffff12;border:1px solid #ffffff30;
 margin:10px 0;padding:14px;border-radius:10px
}
.option:hover{background:#ffffff25}
.option.selected{border:2px solid #55d9ff;background:#087da555}
.option.correct{background:#087d4c}
.option.wrong{background:#a52d3b}
.small{color:#b9d9f5;font-size:14px}
.hidden{display:none}
#timer{color:#ffe36a;font-size:20px;font-weight:bold}
#message{white-space:pre-wrap;color:#ffe36a;margin-top:12px}
.progress{height:9px;background:#ffffff25;border-radius:20px;overflow:hidden}
.progress div{height:100%;background:#42dcff;width:0%}
.result{text-align:center}
.result h2{color:#6ce6ff;font-size:30px}
footer{text-align:center;color:#9cb8d6;padding:20px}
</style>
</head>
<body>
<div class="container">
<header>
 <h1>🧠 हिंदी AI Quiz Generator</h1>
 <p>AI से अपना क्विज बनाएं, खेलें और अपना ज्ञान बढ़ाएं!</p>
</header>

<section class="card" id="setup">
 <h2>⚙️ Quiz सेटिंग्स</h2>

 <label>Groq API Key</label>
 <input id="apiKey" type="password" placeholder="अपनी Groq API Key डालें">
 <p class="small">API Key: console.groq.com से प्राप्त करें। इसे किसी के साथ साझा न करें।</p>

 <label>Quiz का विषय</label>
 <input id="topic" placeholder="जैसे: विज्ञान, इतिहास, कंप्यूटर, सामान्य ज्ञान">

 <label>कठिनाई स्तर</label>
 <select id="difficulty">
  <option value="आसान">आसान</option>
  <option value="मध्यम">मध्यम</option>
  <option value="कठिन">कठिन</option>
 </select>

 <label>प्रश्नों की संख्या</label>
 <select id="count">
  <option value="5">5 प्रश्न</option>
  <option value="10">10 प्रश्न</option>
  <option value="15">15 प्रश्न</option>
 </select>

 <label>प्रति प्रश्न समय</label>
 <select id="timeLimit">
  <option value="20">20 सेकंड</option>
  <option value="30" selected>30 सेकंड</option>
  <option value="45">45 सेकंड</option>
  <option value="60">60 सेकंड</option>
 </select>

 <label>AI Model</label>
 <select id="model">
  <option value="openai/gpt-oss-120b">GPT OSS 120B</option>
  <option value="openai/gpt-oss-20b">GPT OSS 20B</option>
 </select>

 <button class="full" id="generateBtn" onclick="generateQuiz()">✨ हिंदी Quiz बनाएं</button>
 <div id="message"></div>
</section>

<section class="card hidden" id="quiz">
 <div style="display:flex;justify-content:space-between;gap:10px">
  <span id="questionNumber">प्रश्न 1</span>
  <span id="timer">⏱️ 30</span>
 </div>
 <div class="progress" style="margin:15px 0"><div id="progress"></div></div>
 <h2 id="question">प्रश्न यहाँ आएगा</h2>
 <div id="options"></div>
 <div id="explanation" class="small"></div>
 <button id="nextBtn" class="full" onclick="nextQuestion()" disabled>अगला प्रश्न ➜</button>
</section>

<section class="card hidden result" id="result">
 <h2>🏆 Quiz पूरा हुआ!</h2>
 <h1 id="finalScore">0 / 5</h1>
 <p id="percentage"></p>
 <p id="feedback"></p>
 <button onclick="location.reload()">🔄 फिर से Quiz खेलें</button>
</section>

<footer>Made with ❤️ | Hindi AI Quiz Generator</footer>
</div>

<script>
let questions=[];
let current=0;
let score=0;
let selected=null;
let timer=null;
let remaining=30;
let answers=[];

async function generateQuiz(){
 const key=document.getElementById("apiKey").value.trim();
 const topic=document.getElementById("topic").value.trim();
 const count=Number(document.getElementById("count").value);
 const difficulty=document.getElementById("difficulty").value;
 const model=document.getElementById("model").value;

 if(!key){showMessage("कृपया Groq API Key डालें।");return}
 if(!topic){showMessage("कृपया Quiz का विषय लिखें।");return}

 const btn=document.getElementById("generateBtn");
 btn.disabled=true;
 btn.textContent="⏳ Quiz बनाया जा रहा है...";
 showMessage("AI आपके लिए हिंदी में प्रश्न तैयार कर रहा है...");

 const prompt=`
आप एक हिंदी शिक्षक हैं। "${topic}" विषय पर ${count} बहुविकल्पीय प्रश्न बनाएं।
कठिनाई: ${difficulty}।
सभी प्रश्न, विकल्प और व्याख्या सरल हिंदी में हों।
केवल वैध JSON लौटाएं। Markdown या अतिरिक्त टेक्स्ट न दें।
JSON का प्रारूप:
{
 "questions":[
  {
   "question":"प्रश्न",
   "options":["विकल्प A","विकल्प B","विकल्प C","विकल्प D"],
   "answer":0,
   "explanation":"उत्तर की व्याख्या"
  }
 ]
}
answer में सही विकल्प का index 0 से 3 तक हो।
ठीक ${count} प्रश्न बनाएं।
`;

 try{
  const response=await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+key
   },
   body:JSON.stringify({
    model:model,
    messages:[{role:"user",content:prompt}],
    temperature:0.5
   })
  });

  const data=await response.json();
  if(!response.ok) throw new Error(data.error?.message||"API Error");

  let content=data.choices[0].message.content.trim();
  content=content.replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();

  const parsed=JSON.parse(content);
  questions=parsed.questions;

  if(!Array.isArray(questions)||questions.length===0)
   throw new Error("AI ने सही प्रश्न नहीं बनाए। दोबारा प्रयास करें।");

  questions=questions.slice(0,count);
  questions.forEach(q=>{
   if(!q.question||!Array.isArray(q.options)||q.options.length!==4||
      !Number.isInteger(q.answer)||q.answer<0||q.answer>3){
    throw new Error("AI से प्राप्त प्रश्नों का प्रारूप सही नहीं है।");
   }
  });

  current=0;score=0;answers=[];
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  showQuestion();

 }catch(error){
  showMessage("त्रुटि: "+error.message+"\nAPI Key और इंटरनेट कनेक्शन जांचें।");
 }finally{
  btn.disabled=false;
  btn.textContent="✨ हिंदी Quiz बनाएं";
 }
}

function showMessage(text){
 document.getElementById("message").textContent=text;
}

function showQuestion(){
 clearInterval(timer);
 selected=null;
 const q=questions[current];

 document.getElementById("questionNumber").textContent=
  `प्रश्न ${current+1} / ${questions.length}`;
 document.getElementById("question").textContent=q.question;
 document.getElementById("progress").style.width=
  (current/questions.length*100)+"%";
 document.getElementById("explanation").textContent="";
 document.getElementById("nextBtn").disabled=true;
 document.getElementById("nextBtn").textContent=
  current===questions.length-1?"परिणाम देखें 🏆":"अगला प्रश्न ➜";

 const box=document.getElementById("options");
 box.innerHTML="";

 q.options.forEach((option,index)=>{
  const btn=document.createElement("button");
  btn.className="option";
  btn.textContent=["A. ","B. ","C. ","D. "][index]+option;
  btn.onclick=()=>selectAnswer(index);
  box.appendChild(btn);
 });

 remaining=Number(document.getElementById("timeLimit").value);
 updateTimer();
 timer=setInterval(()=>{
  remaining--;
  updateTimer();
  if(remaining<=0){
   clearInterval(timer);
   if(selected===null) selectAnswer(-1);
  }
 },1000);
}

function updateTimer(){
 document.getElementById("timer").textContent="⏱️ "+remaining+" सेकंड";
}

function selectAnswer(index){
 if(selected!==null)return;
 selected=index;
 clearInterval(timer);

 const q=questions[current];
 const buttons=document.querySelectorAll(".option");

 buttons.forEach((btn,i)=>{
  btn.disabled=true;
  if(i===q.answer)btn.classList.add("correct");
  else if(i===index)btn.classList.add("wrong");
 });

 if(index===q.answer)score++;

 answers.push({
  question:q.question,
  chosen:index,
  correct:q.answer
 });

 document.getElementById("explanation").textContent=
  (index===q.answer?"✅ सही जवाब! ":"❌ सही जवाब: "+q.options[q.answer]+"\n")+
  "व्याख्या: "+(q.explanation||"");
 document.getElementById("nextBtn").disabled=false;
}

function nextQuestion(){
 if(selected===null)return;
 current++;
 if(current<questions.length){
  showQuestion();
 }else{
  showResult();
 }
}

function showResult(){
 clearInterval(timer);
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 const percent=Math.round(score/questions.length*100);
 document.getElementById("finalScore").textContent=
  score+" / "+questions.length;
 document.getElementById("percentage").textContent=
  "आपका स्कोर: "+percent+"%";

 let feedback=percent>=80?"बहुत शानदार! 🎉":
  percent>=50?"अच्छा प्रयास! 👍":"अभ्यास जारी रखें! 💪";
 document.getElementById("feedback").textContent=feedback;
}
</script>
</body>
</html>
